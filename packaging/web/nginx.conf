# GeoMag Analyzer - Nginx reverse proxy configuration (Web-Service Mode)
#
# IMPORTANT: Run backend with EXACTLY ONE Uvicorn worker process (`--workers 1`),
# because JobManager stores active ProcessPoolExecutor futures, cancel tokens, and
# live WebSocket/SSE subscriber queues in process memory:
#
#   uvicorn geomag_api.main:app --host 127.0.0.1 --port 8000 --workers 1 --proxy-headers
#
# Adjust `server_name`, TLS certificate paths, and `GEOMAG_ALLOWED_HOSTS` /
# `GEOMAG_ALLOWED_ORIGINS` in `geomag-analyzer.env` to match your domain.

upstream geomag_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name geomag.example.edu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geomag.example.edu;

    ssl_certificate     /etc/ssl/certs/geomag.example.edu.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/geomag.example.edu.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;

    # Live WebSocket progress stream for Tier 3 XWT/WTC Monte Carlo jobs
    location /ws/ {
        proxy_pass http://geomag_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Server-Sent Events (SSE) fallback and job submission/cancellation endpoints
    location /api/jobs/ {
        proxy_pass http://geomag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # REST API + static React SPA served by FastAPI
    location / {
        proxy_pass http://geomag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
