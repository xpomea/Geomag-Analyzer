# Phase 2 Branch A: Masked Conditional MLP-AE / beta-VAE + ablations across 4-fold LOOE-CV
phase: phase2
phase_prefix: p2
branch: A
model_type: mlp_ae
dataset_path: ml_research/data_cache/geomag_ml_oct2026_clean_v1.npz
out_dir: ml_research/artifacts
seed: 42

split_protocol: looe_4fold
baseline_mode: temp_train_quiet_proxy
baseless_policy: train_quiet_proxy
variation_step_policy: flag_qc_exclude
default_zero_shot_stations: ["LVV", "BEL", "MEA"]

eval:
  modes: ["M1", "M2", "M3_500km", "M3_1000km", "M4"]
  m2_drop_frac: 0.25
  m2_repeats: 5
  min_obs: 10
  stability_drop_fracs: [0.20, 0.30, 0.40]
  stability_repeats: 5

base:
  tag: mlp_ae_k5_ut_decorr_zscore
  scaler_mode: zscore_per_station
  model:
    latent_dim: 5
    use_ut_cond: true
    use_doy: auto
    bottleneck_mode: ae_decorr
    hidden_dim: 256
    mid_dim: 128
    dropout: 0.1
  train:
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 128
    max_epochs: 100
    warmup_epochs: 5
    min_lr_ratio: 0.01
    early_stopping_patience: 15
    grad_clip: 1.0
    use_amp: true
    huber_delta: 1.0
    w_tgt: 2.0
    w_obs: 1.0
    beta_max: 0.0
    beta_warmup_epochs: 15
    lambda_cov: 0.05
    lambda_cons: 0.1
    cov_min_batch_size: 8
    train_mask_mode: m1_m2
    mask_probs:
      M1: 0.30
      M2: 0.70
    m2_drop_range: [0.15, 0.40]
    m3_radius_range_km: [500.0, 1000.0]
    min_obs: 10
    val_m2_drop_frac: 0.25
    val_m2_repeats: 3
    eval_batch_size: 1024

ablations:
  k3:
    tag: mlp_ae_k3_ut_decorr_zscore
    model:
      latent_dim: 3

  k4:
    tag: mlp_ae_k4_ut_decorr_zscore
    model:
      latent_dim: 4

  no_ut:
    tag: mlp_ae_k5_nout_decorr_zscore
    model:
      use_ut_cond: false

  asinh:
    tag: mlp_ae_k5_ut_decorr_asinh
    scaler_mode: asinh_global

  plain_ae:
    tag: mlp_ae_k5_ut_plain_zscore
    model:
      bottleneck_mode: ae
    train:
      lambda_cov: 0.0
      lambda_cons: 0.1

  beta_vae:
    tag: mlp_bvae_k5_ut_zscore
    model:
      bottleneck_mode: beta_vae
    train:
      beta_max: 0.01
      beta_warmup_epochs: 15
      lambda_cov: 0.0
      lambda_cons: 0.1

  no_mask:
    tag: mlp_ae_k5_ut_nomask_zscore
    train:
      train_mask_mode: none
      lambda_cons: 0.0

  without_baseless:
    tag: mlp_ae_k5_ut_decorr_nobaseless
    baseless_policy: exclude
