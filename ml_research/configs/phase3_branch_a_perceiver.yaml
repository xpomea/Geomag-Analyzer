# Phase 3 Branch A: Spatial Set Transformer + Perceiver-Bottleneck AE across 4-fold LOOE-CV
phase: phase3
phase_prefix: p3
branch: A
model_type: perceiver_ae
dataset_path: ml_research/data_cache/geomag_ml_oct2026_clean_v1.npz
out_dir: ml_research/artifacts
seed: 42

split_protocol: looe_4fold
baseline_mode: temp_train_quiet_proxy
baseless_policy: train_quiet_proxy
variation_step_policy: flag_qc_exclude
default_zero_shot_stations: ["LVV", "BEL", "MEA"]

eval:
  modes: ["M1", "M2", "M3_500km", "M3_1000km", "M4"]
  m2_drop_frac: 0.25
  m2_repeats: 5
  min_obs: 10
  stability_drop_fracs: [0.20, 0.30, 0.40]
  stability_repeats: 5

base:
  tag: perceiver_ae_k5_ut_decorr_asinh
  scaler_mode: asinh_global
  zero_shot: false
  model:
    d_in: 9
    d_out: 3
    latent_dim: 5
    use_ut_cond: true
    use_doy: auto
    bottleneck_mode: ae_decorr
    d_model: 128
    n_enc_layers: 3
    n_heads: 4
    d_ff: 256
    n_lat_queries: 4
    dropout: 0.1
    use_spatial_bias: true
    use_station_emb: false
  train:
    lr: 5.0e-4
    weight_decay: 1.0e-4
    batch_size: 64
    max_epochs: 100
    warmup_epochs: 5
    min_lr_ratio: 0.01
    early_stopping_patience: 15
    grad_clip: 1.0
    use_amp: true
    huber_delta: 1.0
    w_tgt: 2.0
    w_obs: 1.0
    beta_max: 0.0
    beta_warmup_epochs: 15
    lambda_cov: 0.05
    lambda_cons: 0.1
    cov_min_batch_size: 8
    train_mask_mode: m1_m2
    mask_probs:
      M1: 0.30
      M2: 0.70
    m2_drop_range: [0.15, 0.40]
    m3_radius_range_km: [500.0, 1000.0]
    min_obs: 10
    val_m2_drop_frac: 0.25
    val_m2_repeats: 3
    eval_batch_size: 512

ablations:
  k3:
    tag: perceiver_ae_k3_ut_decorr_asinh
    model:
      latent_dim: 3

  k4:
    tag: perceiver_ae_k4_ut_decorr_asinh
    model:
      latent_dim: 4

  no_ut:
    tag: perceiver_ae_k5_nout_decorr_asinh
    model:
      use_ut_cond: false

  beta_vae:
    tag: perceiver_bvae_k5_ut_asinh
    model:
      bottleneck_mode: beta_vae
    train:
      beta_max: 0.01
      beta_warmup_epochs: 15
      lambda_cov: 0.0
      lambda_cons: 0.1

  no_spatial_bias:
    tag: perceiver_ae_k5_nobias_asinh
    model:
      use_spatial_bias: false

  zscore:
    tag: perceiver_ae_k5_ut_decorr_zscore
    scaler_mode: zscore_per_station

  zero_shot:
    tag: perceiver_ae_k5_zs_asinh
    zero_shot: true
